services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: padel_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Padel!123"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./docker/sqlserver/entrypoint.sh:/usr/src/app/entrypoint.sh
      - ./docker/sqlserver/init:/usr/src/app/init
    entrypoint: ["/bin/bash", "/usr/src/app/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'Padel!123' -d PadelDB -Q 'SELECT 1' -b -C 2>/dev/null || exit 1"]
      interval: 15s
      retries: 12
      start_period: 60s
      timeout: 10s

  backend:
    build:
      context: ./Padel_Backend
      dockerfile: Dockerfile
    container_name: padel_backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./padel-frontend
      dockerfile: Dockerfile
    container_name: padel_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlserver_data:
