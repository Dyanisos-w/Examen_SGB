spring:
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.SQLServerDialect}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-which-is-very-long-123456}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}

app:
  datasource:
    user:
      jdbc-url: jdbc:sqlserver://localhost:1433;databaseName=PadelDB;encrypt=false;trustServerCertificate=true
      username: Utilisateur_Padel
      password: Utilisateur@Padel1
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    admin:
      jdbc-url: jdbc:sqlserver://localhost:1433;databaseName=PadelDB;encrypt=false;trustServerCertificate=true
      username: Admin_Padel
      password: Administrateur@Padel1
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
