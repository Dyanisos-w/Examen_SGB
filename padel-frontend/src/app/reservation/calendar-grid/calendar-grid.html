<div class="bg-white rounded-xl shadow overflow-hidden">

  <div class="grid"
       [style.grid-template-columns]="gridColumns">

    <!-- HEADER -->
    <ng-container *ngFor="let day of weekDates">
      <div class="text-center py-4 border-b border-gray-200 bg-gray-50">
        <div class="font-semibold text-gray-700 text-sm">
          {{ day | date:'EEE' }}
        </div>
        <div class="text-xs text-gray-500">
          {{ day | date:'dd/MM' }}
        </div>
      </div>
    </ng-container>

    <!-- SLOTS -->
    <ng-container *ngFor="let slot of timeSlots">
      <ng-container *ngFor="let day of weekDates">
        <div
          [class]="isPast(day, slot)
            ? 'h-10 flex items-center justify-center border border-gray-100 bg-gray-50 text-xs text-gray-300 cursor-not-allowed'
            : isOccupied(day, slot)
              ? 'h-10 flex items-center justify-center border border-gray-100 bg-red-50 text-xs text-red-400 cursor-not-allowed'
              : 'h-10 flex items-center justify-center border border-gray-100 text-xs text-gray-500 hover:bg-sky-50 hover:text-sky-700 cursor-pointer transition duration-150'"
          (click)="onSlotClick(day, slot)">

          <span *ngIf="!isPast(day, slot) && isOccupied(day, slot)">✕</span>
          <span *ngIf="!isPast(day, slot) && !isOccupied(day, slot)">{{ slot }}</span>

        </div>
      </ng-container>
    </ng-container>

  </div>

</div>
