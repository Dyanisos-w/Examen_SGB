<div class="bg-white rounded-xl shadow overflow-hidden">

  <div class="grid"
       [style.grid-template-columns]="gridColumns">

    <!-- HEADER -->
    <ng-container *ngFor="let day of weekDates">
      <div class="text-center py-4 border-b border-gray-200 bg-gray-50">
        <div class="font-semibold text-gray-700">
          {{ day | date:'EEEE' }}
        </div>
        <div class="text-sm text-gray-500">
          {{ day | date:'dd/MM' }}
        </div>
      </div>
    </ng-container>

    <!-- SLOTS -->
    <ng-container *ngFor="let slot of timeSlots">
      <ng-container *ngFor="let day of weekDates">
        <div
          class="h-12 flex items-center justify-center
                 border border-gray-100
                 text-sm text-gray-600
                 hover:bg-sky-100
                 hover:text-sky-700
                 cursor-pointer
                 transition duration-150"
          (click)="onSlotClick(day, slot)">

          {{ slot }}

        </div>
      </ng-container>
    </ng-container>

  </div>

</div>
