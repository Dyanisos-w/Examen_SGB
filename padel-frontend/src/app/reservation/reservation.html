<app-header></app-header>
<div class="w-full min-h-screen bg-gray-50 p-6">

  <div class="space-y-6 mt-6">
    <div class="flex items-center gap-4 py-2 border-b border-gray-200">
      <span class="text-sm text-gray-600">Site</span>
      <span *ngIf="loadingSites" class="text-gray-400 text-sm">Chargement des sites...</span>
      <select
        *ngIf="!loadingSites && canChooseSite"
        class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-sky-500"
        [value]="selectedSiteId"
        (change)="onSiteChange(($any($event.target)).value)">
        <option *ngFor="let site of sites" [value]="site.siteId">{{ site.nom }}</option>
      </select>
      <span *ngIf="!loadingSites && !canChooseSite" class="px-3 py-2 rounded-lg bg-gray-100 text-sm text-gray-700">
        {{ getSelectedSiteName() }}
      </span>
      <app-terrain-selector
        [siteId]="selectedSiteId"
        (terrainChange)="onTerrainChange($event)">
      </app-terrain-selector>
    </div>

    <app-week-navigator
      [weekNumber]="weekNumber"
      (previous)="previousWeek()"
      (next)="nextWeek()">
    </app-week-navigator>
  </div>

  <!-- Légende -->
  <div class="flex gap-6 mt-4 mb-2 text-xs text-gray-500">
    <span class="flex items-center gap-1.5">
      <span class="w-4 h-4 rounded bg-sky-100 inline-block"></span> Disponible
    </span>
    <span class="flex items-center gap-1.5">
      <span class="w-4 h-4 rounded bg-red-100 inline-block"></span> Occupé
    </span>
    <span class="flex items-center gap-1.5">
      <span class="w-4 h-4 rounded bg-gray-100 inline-block"></span> Passé
    </span>
  </div>

  <div class="space-y-6 mt-2">
    <app-calendar-grid
      [weekDates]="weekDates"
      [getSlotsForDayFn]="getSlotsForDay.bind(this)"
      [isOccupiedFn]="isOccupied.bind(this)"
      (slotSelected)="onSlotSelected($event)">
    </app-calendar-grid>
  </div>

</div>
