<div class="w-full min-h-screen bg-gray-50 p-6">

  <app-terrain-selector
    (terrainChange)="onTerrainChange($event)">
  </app-terrain-selector>

  <div class="space-y-6 mt-6">>
    <app-week-navigator
      [weekNumber]="weekNumber"
      (previous)="previousWeek()"
      (next)="nextWeek()">
    </app-week-navigator>
  </div>

  <div class="space-y-6 mt-6">
    <app-calendar-grid
      [weekDates]="weekDates"
      [timeSlots]="timeSlots">
    </app-calendar-grid>
  </div>

</div>
