<header class="hidden h-20 items-center border-b border-gray-800 bg-black px-10 text-white lg:flex">

  <!-- LOGO -->
  <div class="flex items-center gap-4 shrink-0">
    <span class="text-2xl font-bold tracking-wide">Padel</span>
  </div>

  <!-- NAV -->
  <nav class="flex-1 flex justify-center gap-8 text-sm uppercase tracking-wide">

    <a
      routerLink="/home"
      routerLinkActive="border-b-2 border-yellow-400 text-yellow-400"
      [routerLinkActiveOptions]="{ exact: true }"
      class="pb-1 hover:text-yellow-400 transition">
      Accueil
    </a>

    <a
      routerLink="/reservation"
      routerLinkActive="border-b-2 border-yellow-400 text-yellow-400"
      class="pb-1 hover:text-yellow-400 transition">
      Réserver
    </a>

    <a
      routerLink="/join-reservation"
      routerLinkActive="border-b-2 border-yellow-400 text-yellow-400"
      class="pb-1 hover:text-yellow-400 transition">
      Rejoindre
    </a>

    <a
      routerLink="/my-reservations"
      routerLinkActive="border-b-2 border-yellow-400 text-yellow-400"
      class="pb-1 hover:text-yellow-400 transition">
      Mes réservations
    </a>

  </nav>

  <!-- AUTH -->
  <div class="flex items-center gap-4 shrink-0">

    @if (isLoggedIn) {
      <button
        type="button"
        (click)="logout()"
        class="text-sm border border-red-400 text-red-400
               px-4 py-2 rounded hover:bg-red-400 hover:text-black transition">
        Se déconnecter
      </button>
    } @else {
      <a
        routerLink="/login"
        class="text-sm text-gray-300 hover:text-white transition">
        Connexion
      </a>

      <a
        routerLink="/register"
        class="text-sm border border-yellow-400 text-yellow-400
               px-4 py-2 rounded hover:bg-yellow-400 hover:text-black transition">
        S'inscrire
      </a>
    }

  </div>

</header>

<header class="sticky top-0 z-30 flex items-center justify-between border-b border-gray-200 bg-white/95 px-4 py-3 shadow-sm backdrop-blur lg:hidden">
  <div class="min-w-0">
    <p class="text-xs font-semibold uppercase tracking-[0.3em] text-sky-600">Padel</p>
    <p class="truncate text-sm font-medium text-gray-700">Navigation</p>
  </div>

  <button
    type="button"
    class="inline-flex h-11 w-11 items-center justify-center rounded-lg border border-gray-200 text-2xl text-gray-700 transition hover:bg-gray-100"
    aria-label="Ouvrir le menu"
    (click)="toggleMenu()">
    ☰
  </button>
</header>

<app-shared-sidebar-menu
  [isOpen]="isMenuOpen"
  [mode]="mobileMenuMode"
  (navigate)="closeMenu()"
  (logoutClick)="logout()">
</app-shared-sidebar-menu>

@if (isMenuOpen) {
  <div
    class="fixed inset-0 z-40 bg-black/50 lg:hidden"
    (click)="closeMenu()">
  </div>
}
