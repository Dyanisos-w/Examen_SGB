<header class="h-20 bg-black text-white flex items-center px-10 border-b border-gray-800">

  <!-- LEFT / LOGO -->
  <div class="flex items-center gap-4">
    <span class="text-2xl font-bold tracking-wide">
      Le Logo
    </span>
  </div>

  <!-- CENTER / NAV -->
  <nav class="flex-1 flex justify-center gap-8 text-sm uppercase tracking-wide">

    <a
      routerLink="/home"
      routerLinkActive="border-b-2 border-yellow-400 text-yellow-400"
      [routerLinkActiveOptions]="{ exact: true }"
      class="pb-1 hover:text-yellow-400 transition">
      Home
    </a>

    <a
      routerLink="/podium"
      routerLinkActive="border-b-2 border-yellow-400 text-yellow-400"
      class="pb-1 hover:text-yellow-400 transition">
      Podium
    </a>

    <a
      routerLink="/reservations"
      routerLinkActive="border-b-2 border-yellow-400 text-yellow-400"
      class="pb-1 hover:text-yellow-400 transition">
      Reservation
    </a>

  </nav>

  <!-- RIGHT / AUTH -->
  <div class="flex items-center gap-4">

    <a
      routerLink="/login"
      class="text-sm text-gray-300 hover:text-white transition">
      Login
    </a>

    <a
      routerLink="/register"
      class="text-sm border border-yellow-400 text-yellow-400
             px-4 py-2 rounded
             hover:bg-yellow-400 hover:text-black transition">
      Sign Up
    </a>

  </div>

</header>
