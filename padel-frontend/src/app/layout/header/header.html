<header class="h-20 bg-black text-white flex items-center px-10 border-b border-gray-800">

  <!-- LOGO -->
  <div class="flex items-center gap-4 shrink-0">
    <span class="text-2xl font-bold tracking-wide">Padel</span>
  </div>

  <!-- NAV -->
  <nav class="flex-1 flex justify-center gap-8 text-sm uppercase tracking-wide">

    <a
      routerLink="/home"
      routerLinkActive="border-b-2 border-yellow-400 text-yellow-400"
      [routerLinkActiveOptions]="{ exact: true }"
      class="pb-1 hover:text-yellow-400 transition">
      Accueil
    </a>

    <a
      routerLink="/reservation"
      routerLinkActive="border-b-2 border-yellow-400 text-yellow-400"
      class="pb-1 hover:text-yellow-400 transition">
      Réserver
    </a>

    <a
      routerLink="/join-reservation"
      routerLinkActive="border-b-2 border-yellow-400 text-yellow-400"
      class="pb-1 hover:text-yellow-400 transition">
      Rejoindre
    </a>

    <a
      routerLink="/my-reservations"
      routerLinkActive="border-b-2 border-yellow-400 text-yellow-400"
      class="pb-1 hover:text-yellow-400 transition">
      Mes réservations
    </a>

  </nav>

  <!-- AUTH -->
  <div class="flex items-center gap-4 shrink-0">

    @if (isLoggedIn) {
      <button
        type="button"
        (click)="logout()"
        class="text-sm border border-red-400 text-red-400
               px-4 py-2 rounded hover:bg-red-400 hover:text-black transition">
        Se déconnecter
      </button>
    } @else {
      <a
        routerLink="/login"
        class="text-sm text-gray-300 hover:text-white transition">
        Connexion
      </a>

      <a
        routerLink="/register"
        class="text-sm border border-yellow-400 text-yellow-400
               px-4 py-2 rounded hover:bg-yellow-400 hover:text-black transition">
        S'inscrire
      </a>
    }

  </div>

</header>
