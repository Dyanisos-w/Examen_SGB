<section class="min-h-screen flex items-center justify-center bg-gray-900">

  <div class="w-full max-w-md bg-gray-800 rounded-lg shadow-lg border border-gray-700">

    <div class="p-6 space-y-6">

      <!-- Retour -->
      <a routerLink="/home"
         class="inline-flex items-center gap-1.5 text-sm text-gray-400 hover:text-white transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Accueil
      </a>

      <!-- Logo -->
      <div class="flex justify-center">
        <span class="text-white text-xl font-semibold">
          Paddel
        </span>
      </div>


      <!-- Title -->
      <h1 class="text-xl font-bold text-white">
        Create an account
      </h1>

      <form
        [formGroup]="registerForm"
        (ngSubmit)="onSubmit()"
        class="space-y-4">
        <!-- Account Type -->
        <div>
          <label class="block mb-3 text-sm font-medium text-gray-300">
            Account Type
          </label>

          <div class="grid grid-cols-3 gap-3">
            <button
              type="button"
              (click)="selectAccountType('GLOBAL')"
              [ngClass]="{
        'bg-sky-600 ring-2 ring-primary-400': registerForm.get('accountType')?.value === 'GLOBAL',
        'bg-gray-700 hover:bg-gray-600': registerForm.get('accountType')?.value !== 'GLOBAL'
      }"
              class="py-2.5 rounded-lg text-sm font-medium text-white transition">
              Global
            </button>

            <button
              type="button"
              (click)="selectAccountType('Site')"
              [ngClass]="{
        'bg-sky-600 ring-2 ring-primary-400': registerForm.get('accountType')?.value === 'Site',
        'bg-gray-700 hover:bg-gray-600': registerForm.get('accountType')?.value !== 'Site'
      }"
              class="py-2.5 rounded-lg text-sm font-medium text-white transition">
              Site
            </button>

            <button
              type="button"
              (click)="selectAccountType('Free')"
              [ngClass]="{
        'bg-sky-600 ring-2 ring-primary-400': registerForm.get('accountType')?.value === 'Free',
        'bg-gray-700 hover:bg-gray-600': registerForm.get('accountType')?.value !== 'Free'
      }"
              class="py-2.5 rounded-lg text-sm font-medium text-white transition">
              Libre
            </button>
          </div>
          <div *ngIf="registerForm.get('accountType')?.value === 'Site'" class="mt-4">

            <label class="block mb-2 text-sm font-medium text-gray-300">
              Select your city
            </label>

            <select
              formControlName="ville"
              class="w-full rounded-lg bg-gray-700 border border-gray-600
           text-white text-sm p-2.5
           focus:ring-primary-600 focus:border-primary-600">

              <option value="">Choose a city</option>
              @for (site of sites; track site.siteId) {
                <option [value]="site.nom">{{ site.nom }}</option>
              }

            </select>
            @if (siteLoadError) {
              <p class="mt-2 text-xs text-red-300">{{ siteLoadError }}</p>
            }

          </div>

        </div>

        <!-- Nom + prénom -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-300">
              Last name
            </label>
            <input
              type="text"
              formControlName="nom"
              placeholder="Dupont"
              class="w-full rounded-lg bg-gray-700 border border-gray-600
                     text-white placeholder-gray-400 text-sm p-2.5
                     focus:ring-primary-600 focus:border-primary-600">
          </div>

          <div>
            <label class="block mb-2 text-sm font-medium text-gray-300">
              First name
            </label>
            <input
              type="text"
              formControlName="prenom"
              placeholder="Jean"
              class="w-full rounded-lg bg-gray-700 border border-gray-600
                     text-white placeholder-gray-400 text-sm p-2.5
                     focus:ring-primary-600 focus:border-primary-600">
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-300">
            Password
          </label>
          <input
            type="password"
            formControlName="password"
            placeholder="••••••••"
            class="w-full rounded-lg bg-gray-700 border border-gray-600
                   text-white placeholder-gray-400 text-sm p-2.5
                   focus:ring-primary-600 focus:border-primary-600">
        </div>

        <!-- Confirm -->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-300">
            Confirm password
          </label>
          <input
            type="password"
            formControlName="confirmPassword"
            placeholder="••••••••"
            class="w-full rounded-lg bg-gray-700 border border-gray-600
                   text-white placeholder-gray-400 text-sm p-2.5
                   focus:ring-primary-600 focus:border-primary-600">
        </div>

        <!-- Terms -->
        <div class="flex items-center gap-2">
          <input
            type="checkbox"
            formControlName="terms"
            class="w-4 h-4 rounded bg-gray-700 border-gray-600
                   text-primary-600 focus:ring-primary-600">
          <label class="text-sm text-gray-400">
            I accept the
            <a routerLink="/terms"
               class="text-primary-500 hover:underline">
              Terms and Conditions
            </a>
          </label>
        </div>







        <!-- Button -->
        <button
          type="submit"
          [disabled]="registerForm.invalid"
          class="w-full py-2.5 rounded-lg text-sm font-medium text-white
                 bg-sky-600 hover:bg-primary-700
                 focus:ring-4 focus:ring-primary-800
                 disabled:opacity-50">
          Create an account
        </button>

        <!-- Footer -->
        <p class="text-sm text-gray-400 text-center">
          Already have an account?
          <a routerLink="/login"
             class="text-primary-500 hover:underline">
            Login here
          </a>
        </p>

      </form>
    </div>
  </div>
</section>
