<div class="flex h-screen bg-gray-900 text-white">

  <app-shared-sidebar-menu
    [isOpen]="isSidebarOpen"
    mode="admin"
    (navigate)="closeSidebar()"
    (logoutClick)="logout()">
  </app-shared-sidebar-menu>

  @if (isSidebarOpen) {
    <div class="fixed inset-0 z-40 bg-black/50 lg:hidden" (click)="closeSidebar()"></div>
  }

  <div class="flex min-h-0 flex-1 flex-col overflow-hidden">
    <app-admin-topbar (menuClick)="toggleSidebar()"></app-admin-topbar>

    <main class="flex-1 p-4 lg:p-6 overflow-y-auto">
  <div class="mx-auto w-full max-w-2xl rounded-xl border border-white/10 bg-[#111827] p-6 text-white">
    <div class="mb-6 flex items-center justify-between">
      <div>
        <h2 class="text-xl font-semibold">Creer un site</h2>
        <p class="text-sm text-slate-300">Action reservee aux GLOBALADMIN.</p>
      </div>

    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="mb-2 block text-sm text-slate-300">Nom du site</label>
        <input formControlName="nom" type="text" class="w-full rounded-lg border border-slate-600 bg-slate-700 p-2.5 text-sm" />
      </div>

      <div>
        <label class="mb-2 block text-sm text-slate-300">Adresse</label>
        <input formControlName="adresse" type="text" class="w-full rounded-lg border border-slate-600 bg-slate-700 p-2.5 text-sm" />
      </div>

      <p class="text-xs text-slate-400">
        Le nombre de terrains est initialise a 0. Ajoute ensuite les terrains via "Creer un terrain".
      </p>

      <button type="submit" [disabled]="isLoading" class="rounded-lg bg-sky-600 px-4 py-2.5 text-sm font-medium hover:bg-sky-500 disabled:opacity-60">
        {{ isLoading ? 'Creation...' : 'Creer le site' }}
      </button>
    </form>
  </div>
    </main>
  </div>
</div>
