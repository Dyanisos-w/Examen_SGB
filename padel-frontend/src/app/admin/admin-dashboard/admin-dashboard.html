<div class="flex h-screen bg-gray-900 text-white">
  <!-- menu latéral -->
  <app-shared-sidebar-menu
    [isOpen]="isSidebarOpen"
    mode="admin"
    (navigate)="closeSidebar()"
    (logoutClick)="logout()"
    (siteChange)="onSiteChange($event)">
  </app-shared-sidebar-menu>

  @if (isSidebarOpen) {
    <div
      class="fixed inset-0 z-40 bg-black/50 lg:hidden"
      (click)="closeSidebar()">
    </div>
  }

  <!-- layout principal -->
  <div class="flex flex-1 flex-col">
    <!-- header -->
    <app-admin-topbar
      (menuClick)="toggleSidebar()">
    </app-admin-topbar>

    <!-- contenu scrollable -->
    <main class="flex-1 overflow-y-auto">
      <app-admin-content [selectedSiteId]="selectedSiteId"></app-admin-content>
    </main>
  </div>

</div>
