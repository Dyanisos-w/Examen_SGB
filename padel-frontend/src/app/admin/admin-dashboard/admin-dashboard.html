<div class="flex min-h-screen bg-gray-900 text-white">

  <app-shared-sidebar-menu
    [isOpen]="isSidebarOpen"
    mode="admin"
    (navigate)="closeSidebar()"
    (logoutClick)="logout()"
    (siteChange)="onSiteChange($event)">
  </app-shared-sidebar-menu>

  @if (isSidebarOpen) {
    <div
      class="fixed inset-0 z-40 bg-black/50 lg:hidden"
      (click)="closeSidebar()">
    </div>
  }

  <div class="flex min-w-0 flex-1 flex-col">
    <app-admin-topbar
      (menuClick)="toggleSidebar()">
    </app-admin-topbar>

    <app-admin-content [selectedSiteId]="selectedSiteId"></app-admin-content>
  </div>

</div>
