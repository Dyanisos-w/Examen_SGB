<main class="flex-1 p-4 lg:p-6 overflow-y-auto">
  <div class="mx-auto w-full max-w-2xl rounded-xl border border-white/10 bg-[#111827] p-6 text-white">
    <div class="mb-6 flex items-center justify-between">
      <div>
        <h2 class="text-xl font-semibold">Creer un admin local</h2>
        <p class="text-sm text-slate-300">Creation reservee aux GLOBALADMIN.</p>
      </div>
      <a routerLink="/admin" class="rounded-md bg-slate-700 px-3 py-2 text-sm hover:bg-slate-600">Retour dashboard</a>
    </div>

    @if (successMatricule) {
      <div class="mb-4 rounded-lg border border-emerald-600/40 bg-emerald-700/20 p-3 text-emerald-200">
        Admin local cree avec succes. Matricule: <strong>{{ successMatricule }}</strong>
      </div>
    }

    @if (errorMessage) {
      <div class="mb-4 rounded-lg border border-red-600/40 bg-red-700/20 p-3 text-red-200">
        {{ errorMessage }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div>
          <label class="mb-2 block text-sm text-slate-300">Nom</label>
          <input formControlName="nom" type="text" class="w-full rounded-lg border border-slate-600 bg-slate-700 p-2.5 text-sm" />
        </div>
        <div>
          <label class="mb-2 block text-sm text-slate-300">Prenom</label>
          <input formControlName="prenom" type="text" class="w-full rounded-lg border border-slate-600 bg-slate-700 p-2.5 text-sm" />
        </div>
      </div>

      <div>
        <label class="mb-2 block text-sm text-slate-300">Ville</label>
        <select formControlName="ville" class="w-full rounded-lg border border-slate-600 bg-slate-700 p-2.5 text-sm">
          <option value="">Choisir une ville</option>
          @for (site of sites; track site.siteId) {
            <option [value]="site.nom">{{ site.nom }}</option>
          }
        </select>
        @if (siteLoadError) {
          <p class="mt-2 text-xs text-red-300">{{ siteLoadError }}</p>
        }
      </div>

      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div>
          <label class="mb-2 block text-sm text-slate-300">Mot de passe</label>
          <input formControlName="password" type="password" class="w-full rounded-lg border border-slate-600 bg-slate-700 p-2.5 text-sm" />
        </div>
        <div>
          <label class="mb-2 block text-sm text-slate-300">Confirmer le mot de passe</label>
          <input formControlName="confirmPassword" type="password" class="w-full rounded-lg border border-slate-600 bg-slate-700 p-2.5 text-sm" />
        </div>
      </div>

      <button type="submit" [disabled]="isLoading" class="rounded-lg bg-sky-600 px-4 py-2.5 text-sm font-medium hover:bg-sky-500 disabled:opacity-60">
        {{ isLoading ? 'Creation...' : 'Creer admin local' }}
      </button>
    </form>
  </div>
</main>
